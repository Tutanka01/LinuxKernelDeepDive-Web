<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-labelledby="t d">
<title id="t">Four attention architectures and what each costs per token of KV cache</title>
<desc id="d">Four side-by-side panels showing how query heads are wired to key/value heads. MHA: 64 query heads wired one-to-one to 64 KV heads, 2.6 MB of KV cache per token. MQA: all 64 query heads converge on a single shared KV head, 41 KB per token. GQA-8: the 64 query heads are split into 8 groups, each group sharing one KV head, 328 KB per token. MLA: all query heads read one compressed 576-dimension latent vector, which an up-projection expands back into per-head keys and values at decode time; only the latent is cached, about 70 KB per token. Six query heads are drawn in each panel to stand for all 64.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6250"/></marker></defs>
