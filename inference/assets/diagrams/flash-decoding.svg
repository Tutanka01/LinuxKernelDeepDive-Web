<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Iowan Old Style, Palatino, Georgia, serif">
<title>FlashDecoding: split-KV manufactures parallelism at batch 1</title>
<desc>Top: without split-KV, one query row attends to the entire KV cache on a single streaming multiprocessor while the other SMs sit idle. Bottom: FlashDecoding splits the KV cache into chunks, hands one chunk to each SM so all compute a partial output plus log-sum-exp in parallel, then a small reduction pass combines the partials with the same rescale-and-add rule as online softmax, producing the identical final output O. This is why batch-1, long-context decode can still saturate the GPU.</desc>
<rect width="880" height="420" rx="8" fill="#f6f1e6"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#221c12">Split-KV: give the single query row somewhere to spread out</text>

<text x="40" y="64" font-size="13" font-weight="600" fill="#221c12">Without split-KV: one query row, most SMs idle</text>
<g>
  <rect x="40" y="80" width="40" height="40" fill="#b8791f" fill-opacity="0.3" stroke="#b8791f"/>
  <rect x="88" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="136" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="184" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="232" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="280" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="328" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="376" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="424" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="472" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="520" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <rect x="568" y="80" width="40" height="40" fill="#ece5d4" stroke="#ddd3bd"/>
  <text x="60" y="104" font-size="9" text-anchor="middle" fill="#221c12">Q</text>
</g>
<text x="324" y="140" font-size="11" text-anchor="middle" fill="#6b6250">1 SM streams the entire KV cache; the rest sit idle</text>

<line x1="24" y1="160" x2="856" y2="160" stroke="#ddd3bd" stroke-width="1"/>

<text x="40" y="185" font-size="13" font-weight="600" fill="#221c12">FlashDecoding: split the KV cache across SMs, then reduce</text>
<g>
  <rect x="40" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <text x="60" y="224" font-size="9" text-anchor="middle" fill="#221c12">C1</text>
  <rect x="88" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <text x="108" y="224" font-size="9" text-anchor="middle" fill="#221c12">C2</text>
  <rect x="136" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <text x="156" y="224" font-size="9" text-anchor="middle" fill="#221c12">C3</text>
  <rect x="184" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="232" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="280" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="328" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="376" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="424" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="472" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="520" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <rect x="568" y="200" width="40" height="40" fill="#2f6d7d" fill-opacity="0.3" stroke="#2f6d7d"/>
  <text x="588" y="224" font-size="9" text-anchor="middle" fill="#221c12">Ck</text>
</g>
<text x="324" y="256" font-size="11" text-anchor="middle" fill="#6b6250">each SM computes a partial (O, m, &#8467;) over its own KV slice, in parallel</text>

<!-- convergence bracket -->
<path d="M 40 264 L 40 268 L 608 268 L 608 264" fill="none" stroke="#8d8370" stroke-width="1"/>
<text x="324" y="280" font-size="9" text-anchor="middle" fill="#8d8370">all chunks feed the reduction</text>

<line x1="60" y1="240" x2="290" y2="300" stroke="#2f6d7d" stroke-width="1"/>
<line x1="324" y1="240" x2="330" y2="300" stroke="#2f6d7d" stroke-width="1"/>
<line x1="588" y1="240" x2="410" y2="300" stroke="#2f6d7d" stroke-width="1"/>

<rect x="250" y="300" width="200" height="40" fill="#b8791f" fill-opacity="0.18" stroke="#b8791f"/>
<text x="350" y="316" font-size="10" text-anchor="middle" fill="#221c12">reduce: rescale + combine</text>
<text x="350" y="330" font-size="10" text-anchor="middle" fill="#221c12">partials (online-softmax rule)</text>

<line x1="350" y1="340" x2="350" y2="356" stroke="#4f7d2c" stroke-width="1.5"/>
<polygon points="350,356 346,348 354,348" fill="#4f7d2c"/>
<rect x="250" y="356" width="200" height="34" fill="#4f7d2c" fill-opacity="0.18" stroke="#4f7d2c"/>
<text x="350" y="377" font-size="10" font-weight="600" text-anchor="middle" fill="#221c12">final O (identical to no split)</text>

<text x="440" y="410" font-size="11" font-style="italic" text-anchor="middle" fill="#6b6250">Split-KV manufactures the parallelism a single query row can't provide &#8212; this is how batch-1, long-context decode saturates the GPU.</text>
</svg>
