<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
<title>The batching knee: throughput and per-token latency vs batch size</title>
<desc>Dual-axis chart against batch size B from 0 to 512 on a linear scale. Left axis, throughput in tokens per second, rises linearly with slope 50 tokens/s per unit batch up to B_crit, then flattens at its plateau of 14,750 tokens/s. Right axis, per-token latency in milliseconds, stays flat at 20 ms up to B_crit then rises linearly. A vertical line at B_crit approximately 295 is labelled the knee, with the region to its left shaded and labelled free lunch and the region to its right shaded and labelled you now pay latency.</desc>
<rect width="880" height="520" rx="8" fill="#f6f1e6"/>
<text x="24" y="34" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="17" font-weight="600" fill="#221c12">The batching knee: free throughput, then a latency bill</text>

<!-- zone shading -->
<rect x="90" y="70" width="432.13" height="360" fill="#4f7d2c" fill-opacity="0.08"/>
<rect x="522.13" y="70" width="317.87" height="360" fill="#a4462e" fill-opacity="0.08"/>

<!-- gridlines (left axis, throughput, every 5000) -->
<line x1="90" y1="430" x2="840" y2="430" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="310" x2="840" y2="310" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="190" x2="840" y2="190" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="70"  x2="840" y2="70"  stroke="#ddd3bd" stroke-width="1"/>

<!-- axes -->
<line x1="90" y1="70" x2="90" y2="430" stroke="#221c12" stroke-width="1.5"/>
<line x1="90" y1="430" x2="840" y2="430" stroke="#221c12" stroke-width="1.5"/>
<line x1="840" y1="70" x2="840" y2="430" stroke="#221c12" stroke-width="1.5"/>

<!-- left axis (throughput) ticks -->
<text x="82" y="434" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#4f7d2c">0</text>
<text x="82" y="314" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#4f7d2c">5,000</text>
<text x="82" y="194" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#4f7d2c">10,000</text>
<text x="82" y="74"  text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#4f7d2c">15,000</text>

<!-- right axis (latency) ticks -->
<text x="848" y="434" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#a4462e">0</text>
<text x="848" y="343" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#a4462e">10</text>
<text x="848" y="254" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#a4462e">20</text>
<text x="848" y="163" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#a4462e">30</text>
<text x="848" y="74"  font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#a4462e">40</text>

<!-- x ticks -->
<line x1="90" y1="430" x2="90" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="236.48" y1="430" x2="236.48" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="382.97" y1="430" x2="382.97" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="675.94" y1="430" x2="675.94" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="840" y1="430" x2="840" y2="436" stroke="#221c12" stroke-width="1.5"/>
<text x="90" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">0</text>
<text x="236.48" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">100</text>
<text x="382.97" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">200</text>
<text x="675.94" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">400</text>
<text x="840" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">512</text>

<!-- B_crit vertical line -->
<line x1="522.13" y1="60" x2="522.13" y2="430" stroke="#b8791f" stroke-width="2"/>
<text x="522.13" y="52" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13" font-weight="600" fill="#b8791f">B_crit ≈ 295 — the knee</text>

<!-- throughput curve (olive), left axis: rises (0,0)-&gt;(295,14750) then flat to (512,14750) -->
<polyline points="90,430 522.13,76 840,76" fill="none" stroke="#4f7d2c" stroke-width="2.5"/>

<!-- latency curve (rust), right axis: flat (0,20ms)-&gt;(295,20ms) then rises to (512,34.7ms) -->
<polyline points="90,250 522.13,250 840,117.6" fill="none" stroke="#a4462e" stroke-width="2.5" stroke-dasharray="7,4"/>

<!-- zone labels -->
<text x="306" y="92" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13.5" font-weight="600" fill="#4f7d2c">free lunch</text>
<text x="306" y="108" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#4f7d2c">extra requests ride nearly free</text>
<text x="681" y="92" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13.5" font-weight="600" fill="#a4462e">you now pay latency</text>
<text x="681" y="108" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#a4462e">batching now costs latency</text>

<!-- axis titles -->
<text x="465" y="474" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250">batch size B (linear, 0–512)</text>
<text x="40" y="250" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250" transform="rotate(-90 40 250)">throughput — tokens/s (all requests)</text>
<text x="866" y="250" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250" transform="rotate(90 866 250)">per-token latency — ms (TPOT)</text>

<!-- legend -->
<rect x="90" y="491" width="18" height="3.5" fill="#4f7d2c"/>
<text x="114" y="497" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#221c12">throughput (left axis)</text>
<rect x="350" y="491" width="18" height="3.5" fill="#a4462e"/>
<text x="374" y="497" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#221c12">per-token latency (right axis)</text>
<rect x="630" y="489" width="4" height="10" fill="#b8791f"/>
<text x="650" y="497" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#221c12">B_crit — the knee</text>
</svg>
