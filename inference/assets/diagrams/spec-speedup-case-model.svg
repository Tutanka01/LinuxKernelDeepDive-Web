<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Atkinson Hyperlegible Next, system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif">
<title>Speculative decoding speedup against batch size, from the case cost model</title>
<desc>Line chart of per-sequence decode speedup from speculative decoding (y axis, 0 to 2.5x) against batch size on a log2 axis from 1 to 256, computed from the course cost model: step = max(14 ms, tokens x 0.089 ms) + KV reads, with draft length 3 and each draft pass costing 5% of a target step. All three curves are flat up to batch 40, where verification of 40 x 4 = 160 tokens reaches the effective knee: 2.2x for acceptance 0.7 and 1.6x for acceptance 0.5. Past the knee every extra sequence adds four tokens of arithmetic and the curves fall. With 3,000-token contexts the KV reads keep the plain step long, so the acceptance-0.7 curve crosses 1.0x only near batch 142 and the acceptance-0.5 curve near batch 83; without KV reads the acceptance-0.7 curve crosses near batch 94. A dashed line marks batch 20, the case at peak, and another marks about 123 sequences, where the BF16 KV pool on the node runs out at 3,250 tokens per request.</desc>
<rect width="880" height="470" rx="8" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#14171c">Speculation is free until verification reaches the knee, then it is paid for</text>
<line x1="80" y1="80" x2="80" y2="380" stroke="#14171c" stroke-width="1"/>
<line x1="80" y1="380" x2="820" y2="380" stroke="#14171c" stroke-width="1"/>
<g stroke="#d3d8df" stroke-width="1"><line x1="80" y1="320" x2="820" y2="320"/><line x1="80" y1="260" x2="820" y2="260"/><line x1="80" y1="200" x2="820" y2="200"/><line x1="80" y1="140" x2="820" y2="140"/><line x1="80" y1="80" x2="820" y2="80"/></g>
<g font-size="11" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" fill="#626a75" text-anchor="end"><text x="72" y="384">0.0&#215;</text><text x="72" y="324">0.5&#215;</text><text x="72" y="264">1.0&#215;</text><text x="72" y="204">1.5&#215;</text><text x="72" y="144">2.0&#215;</text><text x="72" y="84">2.5&#215;</text></g>
<rect x="80" y="260" width="740" height="120" fill="#b42318" fill-opacity="0.10"/>
<text x="90" y="276" font-size="10" fill="#b42318" text-anchor="start">below 1.0&#215;: speculation costs more than it saves</text>
<g font-size="11" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" fill="#626a75" text-anchor="middle"><text x="80.0" y="398">1</text><text x="172.5" y="398">2</text><text x="265.0" y="398">4</text><text x="357.5" y="398">8</text><text x="450.0" y="398">16</text><text x="542.5" y="398">32</text><text x="635.0" y="398">64</text><text x="727.5" y="398">128</text><text x="820.0" y="398">256</text></g>
<text x="450" y="420" font-size="12" fill="#555d68" text-anchor="middle">batch: sequences decoding in the step (log scale)</text>
<text x="30" y="230" font-size="12" fill="#555d68" text-anchor="middle" transform="rotate(-90 30 230)">TPOT speedup vs. no speculation</text>
<line x1="479.8" y1="80" x2="479.8" y2="380" stroke="#14171c" stroke-width="1" stroke-dasharray="4,4" opacity="0.55"/>
<text x="484.8" y="96" font-size="11" fill="#14171c" text-anchor="start">case at peak: 20</text>
<line x1="572.3" y1="80" x2="572.3" y2="380" stroke="#14171c" stroke-width="1" stroke-dasharray="4,4" opacity="0.55"/>
<text x="577.3" y="110" font-size="11" fill="#14171c" text-anchor="start">knee: 40 &#215; 4 = 160 tokens</text>
<line x1="722.2" y1="80" x2="722.2" y2="380" stroke="#14171c" stroke-width="1" stroke-dasharray="4,4" opacity="0.55"/>
<text x="717.2" y="372" font-size="11" fill="#14171c" text-anchor="end">KV pool full: ~123 requests of 3,250 tokens</text>
