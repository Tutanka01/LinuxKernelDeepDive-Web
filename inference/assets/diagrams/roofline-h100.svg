<text x="252.11" y="386" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#6b6250" text-anchor="start">I = 1 FLOP / 6 B &#8776; 0.17</text>
<circle cx="736.55" cy="100.37" r="5" fill="#2f6d7d"/>
<line x1="736.55" y1="105.37" x2="736.55" y2="146" stroke="#2f6d7d" stroke-width="1"/>
