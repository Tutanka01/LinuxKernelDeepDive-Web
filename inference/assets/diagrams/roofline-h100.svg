<text x="638" y="325" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#221c12">I_ridge = FLOP/s &#247; byte/s</text>
<text x="654" y="342" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#221c12">= 9.90e14 &#247; 3.35e12</text>
<text x="654" y="362" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#b8791f">&#8776; 295 FLOP/byte</text>
<path d="M 622 328 L 619.65 328" stroke="#6b6250" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="356.82" y="408" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13" font-weight="600" fill="#a4462e" text-anchor="middle" letter-spacing="1.2">MEMORY-BOUND</text>
<text x="356.82" y="426" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250" text-anchor="middle">I &lt; 295 &#8212; the tensor cores wait on HBM</text>
<text x="726.82" y="408" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13" font-weight="600" fill="#4f7d2c" text-anchor="middle" letter-spacing="1.2">COMPUTE-BOUND</text>
<text x="726.82" y="426" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250" text-anchor="middle">I &gt; 295 &#8212; HBM waits on the tensor cores</text>
