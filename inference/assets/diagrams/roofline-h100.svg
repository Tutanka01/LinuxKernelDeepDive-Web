<text x="736.55" y="180" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#6b6250" text-anchor="middle">I &#8776; N, in the thousands</text>
<text x="24" y="507" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#8d8370">H100 SXM5: 990 TFLOP/s dense BF16, 3.35 TB/s HBM3. Both axes logarithmic; the ridge does not move when your workload does.</text>
