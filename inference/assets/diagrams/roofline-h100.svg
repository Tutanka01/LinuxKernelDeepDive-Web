<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t d">
<title id="t">Roofline model for an NVIDIA H100</title>
<desc id="d">A log-log roofline chart. The horizontal axis is arithmetic intensity in FLOPs per byte, from 0.1 to 10000. The vertical axis is attainable throughput in FLOP per second, from 0.1 to 1000 TFLOP/s. A sloped bandwidth roof, attainable equals intensity times 3.35 terabytes per second, rises from the left and meets a flat compute roof of 990 TFLOP/s at the ridge point, intensity 295 FLOP per byte. The region left of the ridge is shaded rust and labelled memory-bound; the region right of the ridge is shaded olive and labelled compute-bound. Two example kernels are marked: a BF16 element-wise vector add at intensity 0.17, deep in the memory-bound zone, and a large square matmul at intensity around 2000, on the compute roof.</desc>
<rect width="880" height="520" rx="8" fill="#f6f1e6"/>
<text x="24" y="34" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="17" font-weight="600" fill="#221c12">The roofline: an H100 has two ceilings, and you hit one of them</text>
<text x="24" y="56" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13" fill="#6b6250">attainable throughput = min( peak FLOP/s , &#160;arithmetic intensity &#215; peak HBM bandwidth )</text>
