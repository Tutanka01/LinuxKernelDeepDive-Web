<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
<title>KV cache growth vs. two hard ceilings</title>
<desc>Line chart of KV cache size in GB for one sequence against context length in tokens, from 0 to about 460,000. Three straight lines by construction (bytes per token is constant): Llama-3-8B at 131 KB/token, Llama-3-70B at 328 KB/token, and DeepSeek-V3 with MLA at about 70 KB/token. Two dashed reference lines mark 80 GB, one H100's memory, and 140 GB, the BF16 weight size of Llama-3-70B. The 70B curve is marked where it crosses the 140 GB weights line, at approximately 427,000 tokens of context.</desc>
<rect width="880" height="540" rx="8" fill="#f6f1e6"/>
<text x="24" y="34" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="17" font-weight="600" fill="#221c12">KV cache growth vs. two hard ceilings</text>

<!-- horizontal gridlines every 20 GB -->
<line x1="90" y1="430" x2="840" y2="430" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="385" x2="840" y2="385" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="340" x2="840" y2="340" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="295" x2="840" y2="295" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="250" x2="840" y2="250" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="205" x2="840" y2="205" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="160" x2="840" y2="160" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="115" x2="840" y2="115" stroke="#ddd3bd" stroke-width="1"/>
<line x1="90" y1="70"  x2="840" y2="70"  stroke="#ddd3bd" stroke-width="1"/>

<!-- y tick labels -->
<text x="82" y="434" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">0</text>
<text x="82" y="389" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">20</text>
<text x="82" y="344" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">40</text>
<text x="82" y="299" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">60</text>
<text x="82" y="254" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">80</text>
<text x="82" y="209" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">100</text>
<text x="82" y="164" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">120</text>
<text x="82" y="119" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">140</text>
<text x="82" y="74"  text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">160</text>

<!-- axes -->
<line x1="90" y1="70" x2="90" y2="430" stroke="#221c12" stroke-width="1.5"/>
<line x1="90" y1="430" x2="840" y2="430" stroke="#221c12" stroke-width="1.5"/>

<!-- x ticks -->
<line x1="90" y1="430" x2="90" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="253" y1="430" x2="253" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="416" y1="430" x2="416" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="579" y1="430" x2="579" y2="436" stroke="#221c12" stroke-width="1.5"/>
<line x1="742" y1="430" x2="742" y2="436" stroke="#221c12" stroke-width="1.5"/>
<text x="90" y="450"  text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">0</text>
<text x="253" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">100K</text>
<text x="416" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">200K</text>
<text x="579" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">300K</text>
<text x="742" y="450" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8d8370">400K</text>

<!-- 128K reference gridline -->
<line x1="304" y1="70" x2="304" y2="430" stroke="#8d8370" stroke-width="1" stroke-dasharray="4,4"/>
<text x="304" y="64" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#6b6250">128K</text>

<!-- reference ceilings: 80 GB (y=250) and 140 GB (y=115) -->
<line x1="90" y1="250" x2="840" y2="250" stroke="#a4462e" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="140" y="246" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#a4462e">80 GB — one H100</text>
<line x1="90" y1="115" x2="840" y2="115" stroke="#a4462e" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="140" y="111" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#a4462e">140 GB — Llama-3-70B weights, BF16</text>

<!-- data curves: straight lines, GB = (KB/token / 1e6) * tokens -->
<!-- Llama-3-8B: 131 KB/tok -> (90,430) to (840,294.4) -->
<line x1="90" y1="430" x2="840" y2="294.4" stroke="#2f6d7d" stroke-width="2.5" fill="none"/>
<!-- Llama-3-70B: 328 KB/tok -> (90,430) to (840,90.5) -->
<line x1="90" y1="430" x2="840" y2="90.5" stroke="#b8791f" stroke-width="2.5" fill="none"/>
<!-- DeepSeek-V3 MLA: ~70 KB/tok -> (90,430) to (840,357.6) -->
<line x1="90" y1="430" x2="840" y2="357.6" stroke="#3b5a8f" stroke-width="2.5" fill="none"/>

<!-- value dots at 128K (ctx=131,072) -->
<circle cx="304" cy="391.4" r="3.5" fill="#2f6d7d"/>
<text x="312" y="395" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#2f6d7d">8B ≈17.2 GB</text>
<circle cx="304" cy="333.3" r="3.5" fill="#b8791f"/>
<text x="312" y="337" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#b8791f">70B ≈43.0 GB</text>
<circle cx="304" cy="409.3" r="3.5" fill="#3b5a8f"/>
<text x="312" y="422" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#3b5a8f">DeepSeek ≈9.2 GB</text>

<!-- crossing marker: 70B curve meets 140 GB line at ctx ≈ 426,829 tokens -->
<circle cx="786" cy="115" r="5" fill="#a4462e" stroke="#f6f1e6" stroke-width="1.5"/>
<text x="778" y="98" text-anchor="end" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" font-weight="600" fill="#a4462e">70B KV cache = 70B weights</text>
<text x="778" y="112" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#a4462e">at ctx ≈ 427K tokens</text>

<!-- axis titles -->
<text x="465" y="474" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250">context length (tokens)</text>
<text x="40" y="250" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250" transform="rotate(-90 40 250)">KV cache — GB (one sequence)</text>

<!-- legend row 1: data series -->
<rect x="90" y="489" width="14" height="4" fill="#2f6d7d"/>
<text x="110" y="497" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#221c12">Llama-3-8B — 131 KB/tok</text>
<rect x="280" y="489" width="14" height="4" fill="#b8791f"/>
<text x="300" y="497" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#221c12">Llama-3-70B — 328 KB/tok</text>
<rect x="480" y="489" width="14" height="4" fill="#3b5a8f"/>
<text x="500" y="497" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#221c12">DeepSeek-V3 MLA — ~70 KB/tok</text>

<!-- legend row 2: reference lines -->
<line x1="90" y1="515" x2="114" y2="515" stroke="#a4462e" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="120" y="519" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="12" fill="#6b6250">reference ceilings — dashed: 80 GB (one H100) · 140 GB (Llama-3-70B weights, BF16)</text>
</svg>
