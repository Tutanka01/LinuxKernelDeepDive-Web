<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
<title>Representable-value spacing: INT8 vs FP8-E4M3</title>
<desc>Two number lines contrasting how 8-bit formats space their representable values. INT8 spaces its 256 codes uniformly across its range, roughly minus 128 to 127. FP8-E4M3 spaces its codes by exponent: densely clustered near zero and increasingly sparse further out, shown here at exponent steps 0.25, 0.5, 1, 2, 4, 8, 16 with mantissa subdivisions omitted for clarity. A caption explains that weight and activation distributions are roughly Gaussian and concentrated near zero, which is exactly where FP8 keeps its finest resolution.</desc>
<rect width="880" height="300" rx="8" fill="#f6f1e6"/>
<text x="24" y="34" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="17" font-weight="600" fill="#221c12">Same 8 bits, different geometry: uniform vs. log-spaced</text>

<!-- INT8 line -->
<text x="70" y="76" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13" font-weight="600" fill="#221c12">INT8 — 256 codes, uniform spacing</text>
<line x1="70" y1="100" x2="810" y2="100" stroke="#221c12" stroke-width="1.5"/>
<line x1="70" y1="92" x2="70" y2="108" stroke="#221c12" stroke-width="1.5"/>
<line x1="162.5" y1="92" x2="162.5" y2="108" stroke="#8d8370" stroke-width="1"/>
<line x1="255" y1="92" x2="255" y2="108" stroke="#8d8370" stroke-width="1"/>
<line x1="347.5" y1="92" x2="347.5" y2="108" stroke="#8d8370" stroke-width="1"/>
<line x1="440" y1="88" x2="440" y2="112" stroke="#221c12" stroke-width="1.5"/>
<line x1="532.5" y1="92" x2="532.5" y2="108" stroke="#8d8370" stroke-width="1"/>
<line x1="625" y1="92" x2="625" y2="108" stroke="#8d8370" stroke-width="1"/>
<line x1="717.5" y1="92" x2="717.5" y2="108" stroke="#8d8370" stroke-width="1"/>
<line x1="810" y1="92" x2="810" y2="108" stroke="#221c12" stroke-width="1.5"/>
<text x="70" y="126" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6250">-128</text>
<text x="440" y="126" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6250">0</text>
<text x="810" y="126" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6250">127</text>
<text x="440" y="142" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#6b6250">dynamic range: 256 (fixed step = 1)</text>

<!-- FP8 line -->
<text x="70" y="182" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="13" font-weight="600" fill="#221c12">FP8-E4M3 — dense near zero, sparse far out</text>
<line x1="70" y1="206" x2="810" y2="206" stroke="#221c12" stroke-width="1.5"/>
<!-- negative side: 16,8,4,2,1,0.5,0.25 -->
<line x1="107" y1="198" x2="107" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="207" y1="198" x2="207" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="282" y1="198" x2="282" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="337" y1="198" x2="337" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="377" y1="198" x2="377" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="405" y1="198" x2="405" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="425" y1="198" x2="425" y2="214" stroke="#a4462e" stroke-width="1.3"/>
<line x1="440" y1="192" x2="440" y2="220" stroke="#221c12" stroke-width="1.5"/>
<!-- positive side: 0.25,0.5,1,2,4,8,16 -->
<line x1="455" y1="198" x2="455" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<line x1="475" y1="198" x2="475" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<line x1="503" y1="198" x2="503" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<line x1="543" y1="198" x2="543" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<line x1="598" y1="198" x2="598" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<line x1="673" y1="198" x2="673" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<line x1="773" y1="198" x2="773" y2="214" stroke="#4f7d2c" stroke-width="1.3"/>
<text x="440" y="232" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6250">0</text>
<text x="455" y="248" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#4f7d2c">0.25</text>
<text x="543" y="248" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#4f7d2c">2</text>
<text x="673" y="248" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#4f7d2c">8</text>
<text x="773" y="248" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#4f7d2c">16</text>
<text x="440" y="264" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="11" fill="#6b6250">dynamic range: ±448 · step grows with magnitude (exponent shown; 3 mantissa bits subdivide each octave further)</text>
</svg>
